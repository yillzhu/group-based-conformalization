[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "group-based-conformalization"
version = "0.1.0"
description = "Historical Chapter 4 companion code for group-based conformal constraint learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas"]

[project.optional-dependencies]
notebook = ["jupyterlab", "ipykernel"]
enrollment = ["torch", "scikit-learn", "tqdm", "gurobipy", "gurobi-machinelearning"]
quadratic = ["tensorflow==2.18.0", "scikit-learn", "gurobipy", "gurobi-machinelearning"]
illustrations = ["matplotlib"]
test = ["scikit-learn"]
workforce-neural = ["torch"]
power = ["scikit-learn", "scipy"]
transparent = ["scipy", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["src"]
